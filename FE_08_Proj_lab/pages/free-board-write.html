<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3182f6" />
    <meta name="description" content="푸른 하늘 여행 자유 게시판에 여행 이야기를 작성하세요." />
    <title>푸른 하늘 여행 · 게시글 작성</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/map.css" />
    <link rel="stylesheet" href="../css/auth-modal.css" />
    <link rel="stylesheet" href="../css/board.css" />
  </head>
  <body class="free-board-page">
    <a class="visually-hidden-focusable skip-link" href="#free-board-write-form">게시글 작성 양식으로 바로가기</a>
    <div data-include="./header.html"></div>

    <main class="board-main">
      <section class="board-hero" aria-labelledby="write-title">
        <div>
          <p class="board-eyebrow">여행 이야기를 들려주세요</p>
          <h1 class="board-title" id="write-title">게시글 작성</h1>
          <p class="board-description">유용한 여행 정보와 소중한 경험을 다른 여행자들과 나눠보세요.</p>
        </div>
      </section>

      <section class="board-panel board-write-panel" aria-label="게시글 작성">
        <form class="board-write-form" id="free-board-write-form" novalidate>
          <div class="board-write-grid">
            <div class="board-form-field">
              <label class="form-label" for="post-category">분류<span class="board-form-required" aria-hidden="true">*</span></label>
              <select class="form-select" id="post-category" name="category" required>
                <option value="" selected disabled>분류 선택</option>
                <option value="review">여행 후기</option>
                <option value="question">질문</option>
                <option value="info">정보 공유</option>
                <option value="food">맛집</option>
                <option value="companion">동행</option>
                <option value="free">자유</option>
              </select>
            </div>

            <div class="board-form-field">
              <label class="form-label" for="post-title">제목<span class="board-form-required" aria-hidden="true">*</span></label>
              <input class="form-control" id="post-title" name="title" type="text" maxlength="80" placeholder="제목을 입력하세요" required />
              <p class="board-form-help"><span>내용을 잘 나타내는 제목을 작성해주세요.</span><span id="post-title-count">0/80</span></p>
            </div>
          </div>

          <div class="board-form-field">
            <label class="form-label" for="post-content">내용<span class="board-form-required" aria-hidden="true">*</span></label>
            <textarea class="form-control" id="post-content" name="content" maxlength="2000" placeholder="여행지, 일정, 교통편처럼 다른 여행자에게 도움이 될 내용을 자유롭게 작성해주세요." required></textarea>
            <p class="board-form-help"><span>개인정보가 포함되지 않도록 확인해주세요.</span><span id="post-content-count">0/2,000</span></p>
          </div>

          <div class="board-form-field">
            <label class="form-label" for="post-images">사진 첨부 <span class="text-secondary fw-normal">(선택)</span></label>
            <input class="form-control board-file-input" id="post-images" name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple />
            <p class="board-form-help"><span>PNG, JPG, WEBP 파일을 최대 3장까지 첨부할 수 있습니다. 한 장당 최대 700KB입니다.</span></p>
          </div>

          <aside class="board-guidelines" aria-label="게시글 작성 안내">
            <strong>작성 전에 확인해주세요</strong>
            타인의 개인정보, 광고성 내용, 불쾌감을 주는 표현은 작성하지 마세요. 여행과 관련 없는 게시글은 안내 없이 삭제될 수 있습니다.
          </aside>

          <p class="board-form-message" id="board-form-message" role="alert" aria-live="polite"></p>

          <div class="board-write-actions">
            <a class="board-cancel-button" href="./free-board.html">취소</a>
            <button class="board-search-button board-submit-button" type="submit">게시글 등록</button>
          </div>
        </form>
      </section>
    </main>

    <div data-include="./footer.html"></div>
    <script type="module">
      import { loadIncludes } from "../js/layout.js";
      import { initAuthModals } from "../js/auth/auth-modal.js";
      import { initAuthState } from "../js/auth/auth-state.js";
      import { initAuthForms } from "../js/auth/auth-form.js";
      import { initFreeBoardWrite } from "../js/board/free-board-write.js";

      await loadIncludes();
      initAuthModals();
      initAuthState();
      initAuthForms();
      initFreeBoardWrite();
    </script>
  </body>
</html>
