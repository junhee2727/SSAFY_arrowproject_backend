<header class="site-header">
  <div class="header-inner page-width">
    <a class="brand" href="./map.html" aria-label="푸른 하늘 여행 홈">
      <span class="brand-logo-crop" aria-hidden="true">
        <img class="brand-logo" src="../resources/design/푸른 하늘 여행 로고.png" alt="" />
      </span>
    </a>
    <nav class="community-nav" aria-label="주요 메뉴">
      <a class="community-nav-link nav-map" href="./map.html">관광지 찾기</a>
      <a class="community-nav-link nav-free-board" href="./free-board.html">자유 게시판</a>
    </nav>
    <div class="header-actions">
      <nav class="auth-nav" aria-label="회원 메뉴">
        <div class="auth-guest-actions" data-auth-guest>
          <button class="btn login-link" type="button" aria-haspopup="dialog" aria-controls="login-modal" data-modal-target="login-modal">로그인</button>
          <button class="btn btn-primary signup-link" type="button" aria-haspopup="dialog" aria-controls="signup-modal" data-modal-target="signup-modal">회원가입</button>
        </div>
        <div class="auth-user-menu" data-auth-user hidden>
          <p class="user-greeting" aria-live="polite">어서오세요 <strong data-user-name>여행자</strong>님!</p>
          <a class="btn my-page-link" href="./my-page.html">마이페이지</a>
          <button class="btn logout-link" type="button" data-logout>로그아웃</button>
        </div>
      </nav>
    </div>
  </div>
</header>
<p class="alert alert-warning page-width my-2" id="auth-status-message" role="status" hidden></p>

<dialog class="auth-modal" id="login-modal" aria-labelledby="login-modal-title" aria-describedby="login-modal-description">
  <div class="auth-modal-shell">
    <header class="auth-modal-header">
      <div>
        <p class="auth-modal-eyebrow">다시 만나 반가워요</p>
        <h2 id="login-modal-title">로그인</h2>
      </div>
      <button class="auth-modal-close" type="button" aria-label="로그인 창 닫기" data-modal-close>
        <span aria-hidden="true">×</span>
      </button>
    </header>

    <p class="auth-modal-description" id="login-modal-description">계정에 로그인하고 나만의 여행을 이어가세요.</p>
    <p class="auth-form-success" id="login-success-message" aria-live="polite"></p>

    <form class="auth-form" id="login-form" novalidate>
      <div class="auth-field">
        <label for="login-email">이메일</label>
        <input class="form-control" id="login-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
        <p class="auth-field-error" id="login-email-error" aria-live="polite"></p>
      </div>

      <div class="auth-field">
        <div class="auth-field-heading">
          <label for="login-password">비밀번호</label>
        </div>
        <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required />
        <p class="auth-field-error" id="login-password-error" aria-live="polite"></p>
      </div>

      <button class="btn auth-primary-button" type="submit">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없나요? <button type="button" data-modal-target="signup-modal">회원가입</button></p>
  </div>
</dialog>

<dialog class="auth-modal" id="signup-modal" aria-labelledby="signup-modal-title" aria-describedby="signup-modal-description">
  <div class="auth-modal-shell">
    <header class="auth-modal-header">
      <div>
        <p class="auth-modal-eyebrow">여행을 함께 시작해요</p>
        <h2 id="signup-modal-title">회원가입</h2>
      </div>
      <button class="auth-modal-close" type="button" aria-label="회원가입 창 닫기" data-modal-close>
        <span aria-hidden="true">×</span>
      </button>
    </header>

    <p class="auth-modal-description" id="signup-modal-description">회원가입하고 여행 이야기를 함께 나눠보세요.</p>

    <form class="auth-form" id="signup-form" novalidate>
      <div class="auth-field">
        <label for="signup-name">이름</label>
        <input class="form-control" id="signup-name" name="name" type="text" minlength="2" maxlength="20" autocomplete="name" placeholder="이름을 입력하세요" required />
        <p class="auth-field-error" id="signup-name-error" aria-live="polite"></p>
      </div>

      <div class="auth-field">
        <label for="signup-email">이메일</label>
        <input class="form-control" id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
        <p class="auth-field-error" id="signup-email-error" aria-live="polite"></p>
      </div>

      <div class="auth-field">
        <label for="signup-password">비밀번호</label>
        <input class="form-control" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8자 이상 입력하세요" required />
        <p class="auth-field-error" id="signup-password-error" aria-live="polite"></p>
      </div>

      <div class="auth-field">
        <label for="signup-password-confirm">비밀번호 확인</label>
        <input class="form-control" id="signup-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="비밀번호를 다시 입력하세요" required />
        <p class="auth-field-error" id="signup-password-confirm-error" aria-live="polite"></p>
      </div>

      <label class="auth-check auth-terms" for="signup-terms">
        <input class="form-check-input" id="signup-terms" name="terms" type="checkbox" required />
        <span><a class="auth-text-link" href="#">이용약관</a> 및 <a class="auth-text-link" href="#">개인정보 처리방침</a>에 동의합니다.</span>
      </label>
      <p class="auth-field-error" id="signup-terms-error" aria-live="polite"></p>

      <button class="btn auth-primary-button" type="submit">회원가입</button>
    </form>

    <p class="auth-switch">이미 계정이 있나요? <button type="button" data-modal-target="login-modal">로그인</button></p>
  </div>
</dialog>
