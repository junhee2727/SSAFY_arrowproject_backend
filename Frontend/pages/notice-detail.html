<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3182f6" />
    <meta name="description" content="푸른 하늘 여행 공지사항 상세 내용입니다." />
    <title>푸른 하늘 여행 · 공지사항 상세</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/map.css" />
    <link rel="stylesheet" href="../css/auth-modal.css" />
    <link rel="stylesheet" href="../css/board.css" />
  </head>
  <body class="notice-page">
    <a class="visually-hidden-focusable skip-link" href="#notice-detail">공지사항 본문으로 바로가기</a>
    <div data-include="./header.html"></div>

    <main class="board-main">
      <section class="board-hero" aria-labelledby="notice-page-title">
        <div>
          <p class="board-eyebrow">푸른 하늘 여행 소식</p>
          <h1 class="board-title" id="notice-page-title"><a class="board-title-home-link" href="./notice.html">공지사항</a></h1>
          <p class="board-description">서비스 이용 안내와 새로운 소식을 확인하세요.</p>
        </div>
      </section>

      <section class="board-panel board-not-found" id="notice-not-found" hidden>
        <h2>공지사항을 찾을 수 없습니다.</h2>
        <p>삭제되었거나 잘못된 주소로 접근했습니다.</p>
        <a class="board-cancel-button" href="./notice.html">목록으로</a>
      </section>

      <article class="post-detail-panel" id="notice-detail">
        <header class="post-detail-header">
          <div class="post-detail-labels"><span class="notice-badge" id="notice-detail-badge"></span></div>
          <h2 class="post-detail-title" id="notice-detail-title"></h2>
          <p class="post-meta" id="notice-detail-meta"></p>
        </header>
        <div class="post-detail-body" id="notice-detail-body"></div>
        <nav class="post-detail-navigation" id="notice-navigation" aria-label="이전 및 다음 공지사항"></nav>
      </article>

      <div class="post-detail-actions" id="notice-detail-actions">
        <a class="board-cancel-button" href="./notice.html">목록으로</a>
      </div>
    </main>

    <div data-include="./footer.html"></div>
    <script type="module">
      import { loadIncludes } from "../js/layout.js";
      import { initAuthModals } from "../js/auth/auth-modal.js";
      import { initAuthState } from "../js/auth/auth-state.js";
      import { initAuthForms } from "../js/auth/auth-form.js";
      import { initNoticeDetail } from "../js/board/notice-detail.js";

      await loadIncludes();
      initAuthModals();
      await initAuthState();
      initAuthForms();
      initNoticeDetail();
    </script>
  </body>
</html>
