<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3182f6" />
    <meta name="description" content="푸른 하늘 여행 회원정보와 게시판 활동을 관리하는 마이페이지입니다." />
    <title>푸른 하늘 여행 · 마이페이지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/map.css" />
    <link rel="stylesheet" href="../css/auth-modal.css" />
    <link rel="stylesheet" href="../css/my-page.css" />
  </head>
  <body class="my-page">
    <a class="visually-hidden-focusable skip-link" href="#my-page-main">마이페이지 본문으로 바로가기</a>
    <div data-include="./header.html"></div>

    <main class="my-page-main" id="my-page-main">
      <section class="my-page-hero" aria-labelledby="my-page-title">
        <p class="my-page-eyebrow">나의 여행 활동</p>
        <h1 id="my-page-title">마이페이지</h1>
        <p>회원정보를 확인하고 이름을 수정하세요.</p>
      </section>

      <section class="my-page-panel my-page-login-required" id="my-page-login-required" hidden>
        <div class="my-page-empty-icon" aria-hidden="true">✈</div>
        <h2>로그인이 필요합니다</h2>
        <p>로그인하면 회원정보를 확인할 수 있어요.</p>
        <button class="my-page-primary-button" type="button" data-modal-target="login-modal">로그인</button>
      </section>

      <div id="my-page-content" hidden>
        <section class="my-page-dashboard" aria-label="회원정보와 활동 요약">
          <article class="my-page-panel profile-panel">
            <div class="profile-heading">
              <div class="profile-avatar" id="profile-avatar" aria-hidden="true">여</div>
              <div>
                <p class="profile-label">회원정보</p>
                <h2 id="profile-heading-name">여행자님</h2>
              </div>
            </div>

            <form class="profile-form" id="profile-form" novalidate>
              <div class="profile-field">
                <label for="profile-name">이름</label>
                <input class="form-control" id="profile-name" type="text" minlength="2" maxlength="20" required />
              </div>
              <div class="profile-field">
                <label for="profile-email">이메일</label>
                <input class="form-control" id="profile-email" type="email" readonly />
              </div>
              <div class="profile-field">
                <label for="profile-created-at">가입일</label>
                <input class="form-control" id="profile-created-at" type="text" readonly />
              </div>
              <p class="my-page-message" id="profile-message" role="status" aria-live="polite"></p>
              <div class="profile-actions">
                <button class="my-page-primary-button" type="submit">이름 저장</button>
              </div>
            </form>
          </article>

        </section>

        <section class="my-page-panel danger-zone" id="account-danger-zone" aria-labelledby="danger-zone-title">
          <div>
            <h2 id="danger-zone-title">계정 삭제</h2>
            <p>계정을 삭제하면 작성한 게시글도 함께 삭제되며 복구할 수 없습니다.</p>
          </div>
          <button class="my-page-danger-button" id="delete-account-button" type="button">계정 삭제</button>
        </section>
      </div>
    </main>

    <div data-include="./footer.html"></div>
    <script type="module">
      import { loadIncludes } from "../js/layout.js";
      import { initAuthModals } from "../js/auth/auth-modal.js";
      import { initAuthState } from "../js/auth/auth-state.js";
      import { initAuthForms } from "../js/auth/auth-form.js";
      import { initMyPage } from "../js/my-page.js";

      await loadIncludes();
      initAuthModals();
      await initAuthState();
      initAuthForms();
      initMyPage();
    </script>
  </body>
</html>
